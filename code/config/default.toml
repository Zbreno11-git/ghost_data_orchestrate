# Runtime configuration. Prices are USD per 1M tokens, standard paid tier,
# from https://ai.google.dev/gemini-api/docs/pricing (page last updated 2026-10-22, checked 2026-10-24).
# Output price applies to candidate + thinking tokens.

[budget]
ceiling_usd = 4.50          # cumulative across the whole project; $0.50 of the $5 stays as margin
ledger_path = "state/usage_ledger.jsonl"

[models."gemini-3.1-flash-lite"]
input_per_m = 0.25
output_per_m = 1.50

[models."gemini-3.8-flash"]
input_per_m = 0.75
output_per_m = 3.75

[models."gemini-2.5-flash-lite"]
input_per_m = 0.10
output_per_m = 0.40

# PNG evidence extraction (C2.5, A17): one transcription per image by the primary model, cross-checked by a
# second cheap read. Results are cached by content hash in state/vision_cache/ (committed) so reruns are free.
[vision]
primary_model = "gemini-3.8-flash"
check_model = "gemini-3.1-flash-lite"
max_output_tokens = 4096
est_input_tokens = 3000
# 3.8-flash rejects MINIMAL with 400 INVALID_ARGUMENT (measured 2026-10-24); LOW is its cheapest level.
thinking_level = { "gemini-3.8-flash" = "LOW", "gemini-3.1-flash-lite" = "MINIMAL" }
cache_dir = "state/vision_cache"

# Paid-call gateway (C4.0/C4.1): every call has a time limit; retries are ours (the SDK's are disabled) and each
# attempt is a separate ledger reservation. Responses are cached by request hash for resume and offline replay.
[gateway]
timeout_s = 90
max_attempts = 3            # total attempts for retryable errors (429, 5xx, transport)
backoff_s = 2.0             # doubled after each failed attempt
cache_dir = "runs/cache/llm"
