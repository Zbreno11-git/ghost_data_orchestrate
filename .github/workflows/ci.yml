name: tests
# Offline gates only: no GEMINI_API_KEY is configured, and the PNG extractions come from the committed
# state/vision_cache, so no paid call can happen here.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r code/requirements.txt
      - run: python -m pytest code/tests scripts/tests -q
      - run: python code/main.py validate dataset/sample_output.csv --split samples
      - run: python code/main.py ingest
